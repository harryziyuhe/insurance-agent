<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Insurance Claims SOP Agent — Test UI</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; display: flex; gap: 1.5rem; }
  #chat-col { flex: 2; }
  #debug-col { flex: 1; font-size: 0.85rem; background: #f4f4f4; padding: 0.75rem; border-radius: 6px; }
  #log { border: 1px solid #ccc; border-radius: 6px; height: 420px; overflow-y: auto; padding: 0.75rem; margin-bottom: 0.5rem; }
  .msg { margin: 0.4rem 0; }
  .user { text-align: right; color: #1a4; }
  .agent { text-align: left; color: #333; }
  #row { display: flex; gap: 0.5rem; }
  #text { flex: 1; padding: 0.4rem; }
  pre { white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
  <div id="chat-col">
    <h2>Insurance Claims SOP Agent</h2>
    <div id="log"></div>
    <div id="row">
      <input id="text" placeholder="Type a message..." autofocus />
      <button id="send">Send</button>
    </div>
  </div>
  <div id="debug-col">
    <h3>Debug</h3>
    <div><b>Phase:</b> <span id="phase">-</span></div>
    <div><b>Verified:</b> <span id="verified">-</span></div>
    <div><b>Matched fields:</b> <span id="matched">-</span></div>
  </div>

<script>
let sessionId = null;

async function ensureSession() {
  if (sessionId) return sessionId;
  const res = await fetch("/api/session", { method: "POST" });
  const data = await res.json();
  sessionId = data.session_id;
  return sessionId;
}

function appendMsg(role, text) {
  const log = document.getElementById("log");
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = (role === "user" ? "You: " : "Agent: ") + text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function send() {
  const input = document.getElementById("text");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  appendMsg("user", text);

  const id = await ensureSession();
  const res = await fetch(`/api/session/${id}/message`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text }),
  });
  const data = await res.json();
  appendMsg("agent", data.reply);
  document.getElementById("phase").textContent = data.phase;
  document.getElementById("verified").textContent = data.verified;
  document.getElementById("matched").textContent = (data.matched_fields || []).join(", ") || "-";
}

document.getElementById("send").addEventListener("click", send);
document.getElementById("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});
</script>
</body>
</html>
