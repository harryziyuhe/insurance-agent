<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claims Assistant</title>
<style>
  :root {
    --bg: #f3f4f7;
    --surface: #ffffff;
    --surface-2: #f7f8fa;
    --border: #e3e5ea;
    --text: #1c1e21;
    --text-muted: #6b7280;
    --accent: #3b5bdb;
    --accent-text: #ffffff;
    --agent-bubble: #f0f1f4;
    --shadow: 0 10px 30px rgba(20, 22, 30, 0.08);
    --radius-lg: 20px;
    --radius-md: 14px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161c;
      --surface: #1c1f27;
      --surface-2: #23262f;
      --border: #2c303a;
      --text: #eef0f4;
      --text-muted: #9aa0ac;
      --accent: #5b7cfa;
      --accent-text: #ffffff;
      --agent-bubble: #262a34;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --bg: #14161c;
    --surface: #1c1f27;
    --surface-2: #23262f;
    --border: #2c303a;
    --text: #eef0f4;
    --text-muted: #9aa0ac;
    --accent: #5b7cfa;
    --accent-text: #ffffff;
    --agent-bubble: #262a34;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  #app {
    width: 100%;
    max-width: 640px;
    height: min(760px, 92vh);
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid var(--border);
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #7c5cff);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 600;
    font-size: 1.1rem;
    flex-shrink: 0;
  }

  .header-text { flex: 1; min-width: 0; }

  h1 {
    font-size: 1.05rem;
    margin: 0 0 2px;
    font-weight: 600;
  }

  #status {
    font-size: 0.8rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #status .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22c55e;
    flex-shrink: 0;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.agent { justify-content: flex-start; }

  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: var(--radius-md);
    line-height: 1.45;
    font-size: 0.92rem;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .row.user .bubble {
    background: var(--accent);
    color: var(--accent-text);
    border-bottom-right-radius: 4px;
  }

  .row.agent .bubble {
    background: var(--agent-bubble);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }

  .typing .bubble {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 14px 16px;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    opacity: 0.5;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  form#composer {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface-2);
  }

  #text {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 999px;
    padding: 11px 18px;
    font-size: 0.92rem;
    outline: none;
    transition: border-color 0.15s ease;
  }
  #text:focus { border-color: var(--accent); }

  #send {
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    border-radius: 999px;
    padding: 0 22px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  #send:hover { opacity: 0.92; }
  #send:active { transform: scale(0.97); }
  #send:disabled { opacity: 0.5; cursor: default; }

  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
</style>
</head>
<body>
  <div id="app">
    <header>
      <div class="avatar">C</div>
      <div class="header-text">
        <h1>Claims Assistant</h1>
        <div id="status"><span class="dot"></span><span id="status-text">Ready to help</span></div>
      </div>
    </header>
    <div id="log"></div>
    <form id="composer">
      <input id="text" placeholder="Type a message…" autocomplete="off" autofocus />
      <button id="send" type="submit">Send</button>
    </form>
  </div>

<script>
let sessionId = null;

const PHASE_LABELS = {
  VERIFY_ID: "Verifying your identity",
  RESOLVE_INTENT: "Finding your claim",
  PROCESS_CASE: "Reviewing your claim",
  POST_PROCESS: "Wrapping up",
  HUMAN_HANDOFF: "Connecting you to a representative",
};

async function ensureSession() {
  if (sessionId) return sessionId;
  const res = await fetch("/api/session", { method: "POST" });
  const data = await res.json();
  sessionId = data.session_id;
  return sessionId;
}

function appendMsg(role, text) {
  const log = document.getElementById("log");
  const row = document.createElement("div");
  row.className = "row " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  row.appendChild(bubble);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return row;
}

function showTyping() {
  const log = document.getElementById("log");
  const row = document.createElement("div");
  row.className = "row agent typing";
  row.innerHTML = '<div class="bubble"><span></span><span></span><span></span></div>';
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return row;
}

function setStatus(phase) {
  document.getElementById("status-text").textContent = PHASE_LABELS[phase] || "Ready to help";
}

async function send(e) {
  e.preventDefault();
  const input = document.getElementById("text");
  const button = document.getElementById("send");
  const text = input.value.trim();
  if (!text) return;

  input.value = "";
  input.disabled = true;
  button.disabled = true;
  appendMsg("user", text);
  const typingRow = showTyping();

  try {
    const id = await ensureSession();
    const res = await fetch(`/api/session/${id}/message`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    const data = await res.json();
    typingRow.remove();
    appendMsg("agent", data.reply);
    setStatus(data.phase);
  } catch (err) {
    typingRow.remove();
    appendMsg("agent", "Sorry, something went wrong reaching the server. Please try again.");
  } finally {
    input.disabled = false;
    button.disabled = false;
    input.focus();
  }
}

document.getElementById("composer").addEventListener("submit", send);
appendMsg("agent", "Hi! I'm here to help with your insurance claim. To get started, could you verify your identity — your full name, date of birth, phone, email, or the last 4 digits of your SSN/ID?");
</script>
</body>
</html>
